# Mosaic — uv-managed project environment.
#
# The application under app/ is a set of standalone CLI scripts (not an
# installable package) and uses only the Python standard library, so the core
# environment has no runtime dependencies. Everything else is opt-in:
#
#   uv sync                          core app + dev tools (pytest)
#   uv sync --extra benchmark        + matplotlib for app/make_benchmark.py
#   uv sync --extra scorecard        + the pets-eval runtime dependencies;
#                                    then run scripts/final/install_pets_eval.sh
#                                    to install pets-eval itself (built from a
#                                    temporary copy, never inside resources/)
#
# See docs/SETUP.md for the full guide.

[project]
name = "mosaic"
version = "0.1.0"
description = "Cross-release mosaic defence for the TrustED PETs Proving Ground 2026."
readme = "README.md"
# .python-version pins 3.13.15; the floor is strictly newer than 3.10.
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Mirrors requirements-benchmark.txt (kept for pip users; not modified).
benchmark = ["matplotlib>=3.7"]
# Runtime dependencies of the vendored pets-eval toolkit, copied verbatim from
# resources/TRUSTED_SinceAI2026_FINAL/TRUSTED_PETS_PROVING_GROUND_2026/toolkit/pyproject.toml
# so they are resolved and locked here. pets-eval itself is installed from a
# wheel built out-of-tree by scripts/final/install_pets_eval.sh.
scorecard = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# app/ is a script collection, not a distributable package: do not build or
# install the project itself into .venv.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
markers = [
    "live: calls the real LLM provider; skipped unless MOSAIC_LIVE_LLM=1",
]
